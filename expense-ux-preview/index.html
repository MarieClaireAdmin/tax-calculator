/* v1.1 mobile-first workflow refinement — no fixed or sticky bottom action controls */
:root{--accent:#847055}
.form-layout.is-empty{grid-template-columns:minmax(0,920px)}
.form-layout .form-main{gap:15px}
.form-layout .form-card{border-radius:12px}
.form-card .step-head h2{margin:0 0 15px}
.form-card .step-head{margin-bottom:2px}
.save-control{display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:100%}
.save-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid #d9dfd3;background:#f6f8f3;border-radius:8px;color:#617061;font-size:11px;line-height:1.35;max-width:100%}
.save-badge .save-dot{width:7px;height:7px;flex:0 0 7px;background:#adb5a6;border-radius:50%}
.save-badge[data-state="saved"] .save-dot{background:#447860}
.save-badge[data-state="saving"] .save-dot{background:#b78c3d}
.save-badge[data-state="error"]{color:#8b4a40;background:#fff2ef;border-color:#e8b9b0}
.save-badge[data-state="error"] .save-dot{background:#b64a3b}
.readonly-field{min-height:44px;background:#f7f7f3;border:1px solid #e8ebe4;border-radius:8px;padding:11px 13px;color:#536256;font-size:13px;display:flex;align-items:center}
.compact-header{padding-top:18px;padding-bottom:17px}
.compact-title{display:flex;justify-content:space-between;align-items:center;gap:12px}
.compact-header .eyebrow{font-size:10px;color:#76806d;letter-spacing:1.2px;margin:0 0 7px}
.compact-header h2{font-size:19px;margin:0 0 5px;overflow-wrap:anywhere;line-height:1.35}
.section-footer{display:flex;justify-content:flex-end;margin-top:10px}
.btn.textual{background:none;border:0;color:#7d674b;min-height:40px;font-weight:700;padding:7px 9px}
.btn.textual:hover{background:#f6f2eb}
.detail-card{scroll-margin-top:22px}
.detail-description{min-width:0;overflow-wrap:anywhere}
.detail-money{min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.detail-item{grid-template-columns:minmax(0,1fr) minmax(132px,auto) 112px;gap:10px}
.detail-item.recent-detail{background:#f5f8f1;border-left:3px solid #819579;padding-left:12px;padding-right:7px}
.detail-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:9px;border-top:1px solid var(--line);margin-top:6px;padding-top:17px}

/* v1.4: real responsive reflow / readable claim history.
   Design-only override. No monetary, submission, PDF, or storage logic changed.
   IMPORTANT: the breakpoint is based on usable form width, not only screen width. */

/* Keep page grid from forcing internal form fields beyond their card. A narrow
   DESKTOP window still has a 242px sidebar, so the v1.3 950px breakpoint was too late. */
@media (max-width:1240px) {
  .form-layout:not(.is-empty) { grid-template-columns: minmax(0,1fr); }
  .form-layout:not(.is-empty) > .summary-panel { position:static; width:100%; }
}

/* The inline-size of the actual form, not the browser window, controls columns.
   This also works when a future platform embeds the form in a narrower panel. */
.form-layout .form-main { container-name: claim-form; container-type: inline-size; }
.expense-row > .field,
.expense-row > .field .combo,
.expense-row > .field .combo-input,
.expense-row > .field input,
.expense-row > .field select,
.expense-row > .field textarea { min-width:0; max-width:100%; }

@container claim-form (max-width:700px) {
  .claim-meta-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .claim-meta-grid > .field:nth-child(3), .claim-meta-grid .claim-reason { grid-column:1/-1; }
  .expense-meta-row { grid-template-columns: minmax(0,1.1fr) minmax(0,.8fr); }
  .expense-meta-row > .field:nth-child(3) { grid-column:1/-1; }
  .expense-purpose-row { grid-template-columns:minmax(0,1fr); }
  .expense-payment-row { grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px 12px; }
  .expense-payment-row > .field:first-child { grid-column:1/-1; }
  .expense-type-row .segment { width:100%; }
}
@container claim-form (max-width:330px) {
  .expense-meta-row { grid-template-columns:minmax(0,1fr); }
  .expense-meta-row > .field:nth-child(3) { grid-column:auto; }
}

/* Legibility: real typography, rather than shrinking the entire table to fit. */
.record-wrap { container: claim-history / inline-size; }
.record-table { font-size:15px; line-height:1.6; }
.record-table th {
  font-size:13.5px; line-height:1.45; color:#465149;
  text-transform:none; letter-spacing:0; font-weight:750; padding:16px 14px;
  white-space:nowrap;
}
.record-table td { padding:18px 14px; vertical-align:middle; }
.record-table td:first-child .tiny-link,
.record-table td:first-child .tiny-link.mono { font-size:14px; font-weight:750; line-height:1.55; }
.record-table td:first-child .small { font-size:13.5px; line-height:1.6; margin-top:3px; }
.record-table td:nth-child(4) { font-variant-numeric:tabular-nums; font-weight:650; }
.record-table .status { font-size:12.5px; padding:5px 10px; }
.record-table .btn.small { font-size:13px; min-height:38px; }
.record-table .btnline { flex-wrap:nowrap; }
.record-table .icon-btn { width:40px;height:40px; }

/* Use readable cards when the actual record-list panel cannot fit six columns.
   The responsive behaviour works even if the viewport is wide but the panel isn't. */
@container claim-history (max-width:900px) {
  .record-table { display:block; min-width:0; width:100%; font-size:15px; }
  .record-table thead { display:none; }
  .record-table tbody { display:grid; gap:12px; padding:13px; }
  .record-table tbody tr {
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
    gap:0 12px; background:#fff; border:1px solid var(--line);
    border-radius:11px; padding:12px 14px;
  }
  .record-table tbody td {
    display:block; min-width:0; overflow-wrap:anywhere;
    padding:9px 4px; border:0; font-size:15px;
  }
  .record-table tbody td:first-child,
  .record-table tbody td:last-child { grid-column:1/-1; }
  .record-table tbody td:first-child { border-bottom:1px solid var(--line); padding-bottom:12px; }
  .record-table tbody td:last-child { padding-top:12px; }
  .record-table tbody td:nth-child(4) { text-align:left; }
  .record-table tbody td:nth-child(2)::before,
  .record-table tbody td:nth-child(3)::before,
  .record-table tbody td:nth-child(4)::before,
  .record-table tbody td:nth-child(5)::before {
    display:block; font-size:12px; font-weight:700; color:#697368; margin-bottom:4px;
  }
  .record-table[data-view="claims"] td:nth-child(2)::before { content:'報支日期'; }
  .record-table[data-view="claims"] td:nth-child(3)::before { content:'費用明細'; }
  .record-table[data-view="claims"] td:nth-child(4)::before { content:'應付／應退'; }
  .record-table[data-view="claims"] td:nth-child(5)::before { content:'單據狀態'; }
  .record-table[data-view="drafts"] td:nth-child(2)::before { content:'費用明細'; }
  .record-table[data-view="drafts"] td:nth-child(3)::before { content:'更新時間'; }
  .record-table[data-view="drafts"] td:nth-child(4)::before { content:'應付／應退'; }
  .record-table .btnline { flex-wrap:wrap; gap:10px; }
}
@media (max-width:500px) {
  .record-table tbody { padding:10px; }
  .record-table tbody tr { padding:10px 12px; }
  .record-table tbody td { font-size:14px; }
  .record-table .btn.small { min-height:42px; }
}

function moneyTriplet(lines,context=''){
 const g=gross(lines),a=advance(lines),n=net(lines);
 const maxDigits=Math.max(fmt(Math.abs(g)).length,fmt(Math.abs(a)).length,fmt(Math.abs(n)).length);
 const digitClass=maxDigits>12?' very-long':maxDigits>9?' long-numbers':'';
 return `<div class="money-triplet ${context}${digitClass}" role="group" aria-label="金額摘要（幣別 NT$）"><div class="money-line gross"><span class="name">報支合計</span>${amt(g)}</div><div class="money-line advance"><span class="name">已預支金額</span>${amt(a)}</div><div class="money-line net"><span class="name">${moneyTitle(lines)}</span>${amt(n)}</div></div>`;
}

function compactHistoryToolbar(){const hasFilters=!!(state.dateFrom||state.dateTo||state.amountQuery||state.filter!=='all');return `<div class="history-compact-toolbar" id="historyCompact" aria-label="捲動時的歷史查詢工具列" aria-hidden="true"><div class="history-compact-top"><div class="history-compact-tabs" role="group" aria-label="單據分類"><button class="tab active" data-act="go-claims">歷史單據 ${state.records.length}</button><button class="tab" data-act="go-drafts">我的草稿 ${state.drafts.length}</button></div>${btn(`${icon('plus','sm')} 新增報支單`,'new','primary history-compact-new')}</div><div class="history-compact-search-row"><label class="searchbox">${icon('search','sm')}<input id="historyQueryCompact" aria-label="搜尋報支事由或單號" placeholder="搜尋報支事由／單號" value="${esc(state.search)}"></label><button class="history-compact-filter ${hasFilters?'has-filter':''}" data-act="toggle-filters" aria-expanded="${state.filtersOpen}" aria-label="${state.filtersOpen?'收合':'展開'}篩選條件" title="篩選條件">${icon('filter','lg')}${hasFilters?'<span class="filter-dot" aria-hidden="true"></span>':''}</button></div><div class="history-compact-more ${state.filtersOpen?'expanded':''}">${compactFilterContents()}</div></div>`;}
function updateCompactHistory(){const bar=$('#historyCompact'),full=$('#historySticky');const active=!!(bar&&full&&state.page==='claims'&&!state.modal&&full.getBoundingClientRect().bottom<7);document.documentElement.classList.toggle('history-compact-active',active);if(bar)bar.setAttribute('aria-hidden',String(!active));}
window.addEventListener('scroll',updateCompactHistory,{passive:true});

 const hasFilters=!!(state.dateFrom||state.dateTo||state.amountQuery||state.filter!=='all');
 return `<section class="claims-page">

function textField(id,label,value,placeholder='',extra='',hint=''){return `<div class="field" id="field-${id}"><label for="${id}">${label}</label><input id="${id}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${extra}><span class="error-text" id="error-${id}"></span>${hint?`<span class="hint">${hint}</span>`:''}</div>`;}

function showError(id,message){const field=$(`#field-${id}`),error=$(`#error-${id}`);if(field)field.classList.add('has-error');if(error)error.textContent=message;}

function normalizedDate(s){s=String(s||'').trim().replaceAll('/','-');if(/^\d{8}$/.test(s))s=s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return '';const d=new Date(s+'T00:00:00Z');return !Number.isNaN(+d)&&d.toISOString().slice(0,10)===s?s:'';}
function strLen(s){return String(s).length;}
function validNum(s,canZero=false){if(!/^(0|[1-9]\d*)$/.test(String(s).trim()))return null;const v=Number(s);if(!Number.isSafeInteger(v)||(canZero?v<0:v<=0))return null;return v;}
function pendingDirty(p){return !!(p.categoryId||p.category||p.summary||p.payeeId||p.payeeName||p.gross||p.voucher||p.memo||p.temporary||Number(p.advanceMagnitude)>0||p.date!==today()||p.month!==today().slice(5,7)||!!p.payeeType);}
function validPending(p){const date=normalizedDate(p.date);if(!date)return focusError('expenseDate','請輸入有效費用日期（例如 20261111）。');if(!/^(0[1-9]|1[0-2])$/.test(p.month))return focusError('month','請選擇有效歸列月份。');if(!CATEGORIES.some(x=>x.id===p.categoryId&&x.name===p.category))return focusError('categoryQuery','請從支出項目清單點選一個有效項目。');if(!p.summary.trim()||strLen(p.summary)>36)return focusError('summary','說明／摘要必填，最多 36 字。');if(!VOUCHERS.includes(p.voucher))return focusError('voucher','請選擇憑證類型。');if(!PAYEE_LABEL[p.payeeType])return focusError('payeeTypeChoice','請先選擇要付款給員工、公司或個人。');if(!p.payeeName||!p.payeeId)return focusError('payeeQuery','請從清單選擇正確付款對象，或建立合格的臨時對象。');if(p.temporary){if(p.payeeType==='employee')return focusError('payeeQuery','員工不得自行新增。');if(!p.payeeIdentity)return focusError('payeeQuery','臨時付款對象缺少識別資料。');}else if(!PAYEES[p.payeeType]?.some(x=>x.id===p.payeeId&&x.name===p.payeeName&&x.identity===p.payeeIdentity))return focusError('payeeQuery','付款對象已變動，請重新選取。');
 const g=validNum(p.gross);if(g===null)return focusError('gross','報帳金額必須是大於 0 的安全範圍整數。');const a=String(p.advanceMagnitude??'').trim()===''?0:validNum(p.advanceMagnitude,true);if(a===null)return focusError('advanceMagnitude','已預支金額請留空或填寫 0 以上整數。');if(!Number.isSafeInteger(g-a))return focusError('gross','金額超出安全範圍，無法加入。');if(strLen(p.memo)>16)return focusError('memo','備註最多 16 字。');return {date,categoryId:p.categoryId,category:p.category,summary:p.summary.trim(),month:p.month,voucher:p.voucher,payeeType:p.payeeType,payeeId:p.payeeId,payeeName:p.payeeName,payeeIdentity:p.payeeIdentity,temporary:!!p.temporary,gross:g,advance:-a,memo:p.memo};}

function changePayeeType(type){if(!PAYEE_LABEL[type])return;const p=state.current.pending;if(p.payeeType===type)return;p.payeeType=type;p.payeeName='';p.payeeId='';p.payeeIdentity='';p.temporary=false;clearError('payeeTypeChoice');saveDraftNow();render();$('#payeeQuery')?.focus();}
function pendingFromLine(l){return {date:l.date,categoryId:l.categoryId,category:l.category,summary:l.summary,month:l.month,voucher:l.voucher,payeeType:l.payeeType,payeeId:l.payeeId,payeeName:l.payeeName,payeeIdentity:l.payeeIdentity,temporary:l.temporary,gross:String(l.gross),advanceMagnitude:Number(l.advance)===0?'':String(-l.advance),memo:l.memo};}
function editLine(index,copy=false){const c=state.current,l=c?.lines[index];if(!l)return;
 if(!copy&&c.editIndex===index){$('#lineEditor')?.scrollIntoView({block:'start',behavior:'smooth'});return;}
 if(pendingDirty(c.pending)){state.formUi.editorOpen=true;render();$('#lineEditor')?.scrollIntoView({block:'start',behavior:'smooth'});toast('你正在填寫另一筆費用。請先儲存或完成這筆，再切換明細，避免遺失輸入。');return;}
 c.pending=pendingFromLine(l);c.editIndex=copy?-1:index;state.formUi.editorOpen=true;state.formUi.recentAdded=null;queueSave();render();$('#lineEditor')?.scrollIntoView({block:'start',behavior:'smooth'});$('#summary')?.focus({preventScroll:true});toast(copy?'明細已複製到編輯區，請確認後加入。':`正在編輯第 ${index+1} 筆。`);}
function deleteLine(index){const c=state.current;if(!c?.lines[index])return;state.formUi.deleted={line:deep(c.lines[index]),index};c.lines.splice(index,1);if(c.editIndex===index){c.editIndex=-1;c.pending=makePending();}else if(c.editIndex>index)c.editIndex--;if(!c.lines.length)state.formUi.editorOpen=true;state.formUi.recentAdded=null;const ok=flushDraft();render();toast(ok?'明細已刪除；可按「撤銷刪除」復原。':'畫面已刪除明細，但本機保存失敗。請重試，不要關閉頁面。');}
function copyRecord(id){const r=pickRecord(id);if(!r||r.status!=='normal'){toast('作廢單不可複製。');return;}const c=blank();c.header.project=r.project;c.header.note=''; // 原系統「其他說明」是否複製尚未定案，保持 F3 現行不複製。
 c.lines=deep(r.lines).map(l=>({...l,date:today()}));state.current=c;state.formUi={headerCollapsed:true,editorOpen:false,recentAdded:null,deleted:null};const ok=flushDraft();page('form');toast(ok?'已複製成新草稿；日期已更新，其他說明未帶入（待確認）。':'已帶入新草稿畫面，但本機保存失敗；請重試保存。');}
function simulateCommit(){
 if(state.busy)return;
 const checkbox=$('#selfCheck');if(!checkbox?.checked){toast('請先勾選已確認內容。');checkbox?.focus();return;}
 if(state.offline){state.modal=null;render();flushDraft();toast('模擬網路中斷：沒有建立單據；請確認本機草稿保存狀態。');return;}
 if(!validateClaim())return;
 state.busy=true;
 const c=state.current;
 const prefix='DEMO-10388-'+today().slice(0,7).replace('-','')+'-';
 const serial=state.records.filter(x=>x.number.startsWith(prefix)).map(x=>Number(x.number.slice(prefix.length))).filter(Number.isSafeInteger);
 const number=prefix+String(Math.max(0,...serial)+1).padStart(3,'0');
 const r={id:'UX-'+Date.now(),number,date:today(),project:c.header.project.trim(),note:c.header.note,lines:deep(c.lines),status:'normal',pdfStatus:state.failPdf?'failed':'ready',events:[{action:'建立示範單據',at:new Date().toISOString()}]};
 const originalRecords=state.records,originalDrafts=state.drafts;
 state.records=[r,...state.records];state.drafts=state.drafts.filter(x=>x.id!==c.id);
 if(!save()){
   state.records=originalRecords;state.drafts=originalDrafts;state.busy=false;state.modal=null;
   setSaveState('error','保存失敗 · 尚未建立');render();toast('瀏覽器保存失敗，未建立示範單據。請重試，資料仍在畫面中。');return;
 }
 state.current=null;state.selectedId=r.id;state.failPdf=false;state.busy=false;page('success');toast('已建立本機示範單據；不是正式 F3 送出。');
}
function retryPdf(id){const r=pickRecord(id);if(!r||r.status!=='normal')return;const oldStatus=r.pdfStatus,oldEvents=[...r.events];r.pdfStatus='ready';r.events.push({action:'PDF 重試（模擬）',at:new Date().toISOString()});if(!save()){r.pdfStatus=oldStatus;r.events=oldEvents;toast('本機保存失敗，文件狀態沒有更新。');return;}if(state.page==='success'){page('success');}else{state.modal={type:'download',id};render();}toast('文件準備狀態已更新（純模擬；未呼叫 F2）。');}
function handleAction(el){const a=el.dataset.act,id=el.dataset.id;if(!a)return;
 if(a==='mobile-menu'){state.mobileNavOpen=true;render();document.querySelector('.mobile-nav-close')?.focus();return;}
 if(a==='close-mobile-menu'){state.mobileNavOpen=false;render();document.querySelector('.mobile-menu-btn')?.focus();return;}
 if(a==='toggle-filters'){state.filtersOpen=!state.filtersOpen;render();updateCompactHistory();return;}
 if(a==='toggle-detail-actions'){state.detailMoreOpen=!state.detailMoreOpen;render();if(state.detailMoreOpen)document.querySelector('.detail-more-menu [role=menuitem]')?.focus();return;}
 if(a==='clear-filters'){state.search='';state.filter='all';state.dateFrom='';state.dateTo='';state.amountQuery='';render();toast('查詢條件已清除。');return;}
 if(a==='nav'){const r=el.dataset.route;if(r==='form'){if(state.page==='form'){state.mobileNavOpen=false;render();window.scrollTo({top:0,behavior:'smooth'});}else startNew();}else if(r==='expense')page('expense');else if(r==='claims')page('claims');else if(r==='drafts')page('drafts');else page('home');return;}
 if(a==='new'){startNew();return;}
 if(a==='go-home'){page('home');return;}
 if(a==='go-expense'){page('expense');return;}
 if(a==='go-claims'){page('claims');return;}
 if(a==='go-drafts'){page('drafts');return;}
 if(a==='add-line'){addLine(false);return;}
 if(a==='retry-save'){flushDraft();render();return;}
 if(a==='toggle-header'){if(!state.current?.header.project.trim()){state.formUi.headerCollapsed=false;render();focusError('projectName','請先填寫報支事由再收合。');return;}state.formUi.headerCollapsed=!state.formUi.headerCollapsed;render();if(!state.formUi.headerCollapsed)$('#projectName')?.focus();return;}
 if(a==='toggle-editor'){state.formUi.editorOpen=true;state.formUi.recentAdded=null;render();$('#lineEditor')?.scrollIntoView({block:'start',behavior:'smooth'});return;}
 if(a==='reuse-last'){const c=state.current,last=c?.lines.at(-1);if(!last)return;const p=makePending();p.date=last.date;p.month=last.month;p.payeeType=last.payeeType;p.payeeId=last.payeeId;p.payeeName=last.payeeName;p.payeeIdentity=last.payeeIdentity;p.temporary=last.temporary;c.pending=p;c.editIndex=-1;state.formUi.editorOpen=true;state.formUi.recentAdded=null;queueSave();render();$('#lineEditor')?.scrollIntoView({block:'start',behavior:'smooth'});toast('已沿用日期與付款對象；請確認新費用的其他欄位。');return;}
 if(a==='undo-delete'){const d=state.formUi.deleted;if(!d)return;state.current.lines.splice(d.index,0,d.line);state.formUi.deleted=null;const ok=flushDraft();render();toast(ok?'已恢復刪除的費用明細。':'明細已在畫面恢復，但本機保存失敗，請重試。');return;}
 if(a==='payee-type'){changePayeeType(el.dataset.type);return;}
 if(a==='pick-category'||a==='pick-payee'){pick(a==='pick-category'?'category':'payee',id);return;}
 if(a==='edit-line'||a==='copy-line'){editLine(Number(el.dataset.i),a==='copy-line');return;}
 if(a==='delete-line'){deleteLine(Number(el.dataset.i));return;}
 if(a==='cancel-edit'){state.current.editIndex=-1;state.current.pending=makePending();state.formUi.editorOpen=false;flushDraft();render();return;}
 if(a==='save-draft'){if(!state.current){toast('目前沒有要保存的草稿。');return;}if(!flushDraft()){toast('本機儲存失敗，仍停留編輯頁。請勿關閉此頁。');return;}page('drafts');toast('草稿已存於這個瀏覽器（非雲端）。');return;}
 if(a==='load-draft'){const d=state.drafts.find(x=>x.id===id);if(!d)return;state.current=deep(d);state.formUi={headerCollapsed:!!d.header.project.trim()&&d.lines.length>0,editorOpen:!!pendingDirty(d.pending)||d.lines.length===0||d.editIndex>=0,recentAdded:null,deleted:null};state.saveState='saved';state.saveMessage='已讀取此瀏覽器草稿 · 非雲端';page('form');return;}
 if(a==='delete-draft'){state.modal={type:'delete-draft',id};render();return;}
 if(a==='confirm-delete-draft'){const originals=state.drafts;state.drafts=state.drafts.filter(x=>x.id!==id);if(!save()){state.drafts=originals;toast('本機儲存失敗，草稿未刪除。請重試。');return;}if(state.current?.id===id)state.current=null;state.modal=null;render();toast('本機草稿已刪除。');return;}
 if(a==='review'){if(!validateClaim())return;state.modal={type:'review'};render();return;}
 if(a==='commit'){simulateCommit();return;}
 if(a==='close-modal'){closeModal();return;}
 if(a==='view'){state.menu=null;state.detailMoreOpen=false;state.modal={type:'view',id};render();return;}
 if(a==='copy-record'){copyRecord(id);return;}
 if(a==='void-record'){state.menu=null;const r=pickRecord(id);if(!r||r.status!=='normal'){toast('這張單不可作廢。');return;}state.modal={type:'void',id};render();return;}
 if(a==='confirm-void'){if(!$('#voidCheck')?.checked){toast('請先確認作廢影響。');return;}const r=pickRecord(id);if(!r||r.status!=='normal')return;const originalStatus=r.status,originalEvents=[...r.events];r.status='void';r.events.push({action:'作廢（示範）',at:new Date().toISOString()});if(!save()){r.status=originalStatus;r.events=originalEvents;toast('本機儲存失敗，作廢並未完成；請重試。');return;}state.modal=null;if(state.page==='success')page('claims');else render();toast('已模擬作廢；資料及單號保留。');return;}
 if(a==='toggle-menu'){state.menu=state.menu===id?null:id;render();if(state.menu)[...document.querySelectorAll('.popup-menu [role="menuitem"]')].find(x=>x.getClientRects().length)?.focus();else [...document.querySelectorAll('.more-actions-btn[data-id="'+id+'"]')].find(x=>x.getClientRects().length)?.focus();return;}
 if(a==='open-download'){state.menu=null;const r=pickRecord(id);if(!r||r.status!=='normal'){toast('作廢單不可下載。');return;}state.modal={type:'download',id};render();return;}
 if(a==='retry-pdf'){retryPdf(id);return;}
 if(a==='scan'){state.modal={type:'scan'};releaseReceiptPreview();render();return;}
 if(a==='scan-demo-fill'){const p=state.current?.pending;if(!p)return;
  // Preserve any values the employee has already entered. This is fictional autofill, NOT OCR.
  if(!p.categoryId&&!p.category){p.categoryId=CATEGORIES[0].id;p.category=CATEGORIES[0].name;}
  if(!p.voucher)p.voucher='發票';
  if(!p.summary)p.summary='虛構發票範例（非照片辨識）';
  if(!p.payeeId&&!p.payeeName){const sample=PAYEES[p.payeeType]?.[0];if(sample){p.payeeId=sample.id;p.payeeName=sample.name;p.payeeIdentity=sample.identity;p.temporary=false;}}
  if(!p.gross)p.gross='880';
  releaseReceiptPreview();state.modal=null;queueSave();render();toast('已填入虛構範例供操作測試；不是由照片辨識。請逐欄確認。');return;}
 if(a==='temp-payee'){state.modal={type:'temp'};render();return;}
 if(a==='confirm-temp'){const p=state.current.pending,type=p.payeeType;if(type==='employee'){toast('員工不可新增臨時對象。');return;}const name=$('#tempName')?.value.trim()||'',raw=$('#tempIdentity')?.value.trim()||'',len=type==='company'?8:4;if(!name){toast('請填臨時付款對象名稱。');$('#tempName')?.focus();return;}if(!new RegExp(`^\\d{${len}}$`).test(raw)){toast(`識別資料應為 ${len} 位數字。`);$('#tempIdentity')?.focus();return;}
  const match=PAYEES[type].find(x=>x.name===name && x.identity.endsWith(raw));if(match){state.modal=null;render();focusError('payeeQuery',`已存在相同正式對象：${match.name}／${match.identity}。請改選正式項目。`);return;}
  p.payeeId='TEMP-'+Date.now();p.payeeName=name;p.payeeIdentity=type==='company'?'統編 '+raw:'證號末四碼 '+raw;p.temporary=true;state.modal=null;saveDraftNow();render();toast('已建立僅本筆使用的虛構臨時對象。');return;}
 if(a==='offline'){state.offline=!state.offline;render();toast(state.offline?'模擬斷線已啟用；草稿仍存在瀏覽器。':'模擬連線已恢復。');return;}
 if(a==='fail-pdf'){state.failPdf=!state.failPdf;render();toast(state.failPdf?'下次建立將模擬 PDF 失敗。':'PDF 失敗模擬已關閉。');return;}
}
function fieldInput(e){const el=e.target;if(['historyQuery','historyQueryCompact','historyAmount','historyAmountCompact'].includes(el.id)){const key=el.id.startsWith('historyQuery')?'search':'amountQuery';state[key]=el.value;const pos=el.selectionStart;const id=el.id;render();requestAnimationFrame(()=>{updateCompactHistory();const compact=document.documentElement.classList.contains('history-compact-active');const preferred=id==='historyQueryCompact'&&!compact?'historyQuery':id==='historyQuery'&&compact?'historyQueryCompact':id;const field=$('#'+preferred);field?.focus({preventScroll:true});if(typeof pos==='number'&&field?.setSelectionRange)field.setSelectionRange(pos,pos);});return;}if(!state.current)return;
 const c=state.current,p=c.pending;
 if(el.id==='projectName')c.header.project=el.value;
 else if(el.id==='otherNotes'){c.header.note=el.value;const t=$('#noteCount');if(t)t.textContent=el.value.length;}
 else if(el.id==='expenseDate')p.date=el.value;
 else if(el.id==='month')p.month=el.value;
 else if(el.id==='voucher')p.voucher=el.value;
 else if(el.id==='summary'){p.summary=el.value;const t=$('#summaryCount');if(t)t.textContent=el.value.length;}
 else if(el.id==='gross'||el.id==='advanceMagnitude'){
  const raw=el.value, normalized=raw.replaceAll(',','');
  if(/^\d*$/.test(normalized)){
   p[el.id]=normalized;
   const digitsBefore=raw.slice(0,el.selectionStart??raw.length).replace(/\D/g,'').length;
   el.value=formatTyping(normalized);
   if(document.activeElement===el&&typeof el.setSelectionRange==='function'){
    let pos=0,seen=0;while(pos<el.value.length&&seen<digitsBefore){if(/\d/.test(el.value[pos]))seen++;pos++;}
    el.setSelectionRange(pos,pos);
   }
  }else p[el.id]=raw.trim();
 }
 else if(el.id==='memo'){p.memo=el.value;const t=$('#memoCount');if(t)t.textContent=el.value.length;}
 else if(el.id==='categoryQuery'){p.category=el.value;p.categoryId='';showOptions('category');}
 else if(el.id==='payeeQuery'){p.payeeName=el.value;p.payeeId='';p.temporary=false;p.payeeIdentity='';showOptions('payee');}
 clearError(el.id);queueSave();}

document.addEventListener('click',e=>{const act=e.target.closest('[data-act]');if(act){e.preventDefault();handleAction(act);return;}if(state.detailMoreOpen&&!e.target.closest('.detail-more-wrap')){state.detailMoreOpen=false;const old=document.querySelector('.detail-more-menu');old?.remove();document.querySelector('.detail-more-btn')?.setAttribute('aria-expanded','false');}if(!e.target.closest('.combo'))closeOptions();if(state.menu&&!e.target.closest('.menu-wrap')){state.menu=null;document.querySelectorAll('.popup-menu').forEach(x=>x.remove());document.querySelectorAll('.more-actions-btn[aria-expanded="true"]').forEach(x=>x.setAttribute('aria-expanded','false'));}if(e.target.matches('[data-scrim]'))closeModal();});
document.addEventListener('input',fieldInput);
document.addEventListener('change',e=>{if(e.target.id==='voucherPhoto'){
  const f=e.target.files?.[0],status=$('#photoStatus');releaseReceiptPreview();
  if(!f){if(status)status.textContent='未選取照片。';return;}
  if(!f.type.startsWith('image/')||f.size>10*1024*1024){e.target.value='';if(status)status.textContent='只接受 10 MB 以內的圖片。';return;}
  receiptPreviewURL=URL.createObjectURL(f);const wrap=$('#photoPreviewWrap'),img=$('#photoPreview');if(img)img.src=receiptPreviewURL;if(wrap)wrap.hidden=false;if(status)status.textContent='已顯示本機照片預覽；並未辨識或儲存。';return;
 }if(['historyFilter','historyFilterCompact'].includes(e.target.id)){state.filter=e.target.value;render();updateCompactHistory();}else if(['historyFrom','historyTo','historyFromCompact','historyToCompact'].includes(e.target.id)){state[e.target.id.startsWith('historyFrom')?'dateFrom':'dateTo']=e.target.value;render();updateCompactHistory();}else if(state.current && ['month','voucher'].includes(e.target.id)){fieldInput(e);}});
document.addEventListener('focusin',e=>{if(e.target.id==='categoryQuery')showOptions('category');if(e.target.id==='payeeQuery')showOptions('payee');});
document.addEventListener('keydown',e=>{
 if(state.mobileNavOpen && e.key==='Tab' && !state.modal){
  const items=$all('.mobile-nav-panel button:not([disabled])').filter(x=>x.getClientRects().length);
  if(items.length){const first=items[0],last=items[items.length-1];
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();return;}
   if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();return;}}
 }
 if(state.modal && e.key==='Tab'){const items=$all('.modal button:not([disabled]),.modal a[href],.modal input:not([disabled]),.modal select:not([disabled]),.modal textarea:not([disabled])').filter(el=>el.getClientRects().length);if(items.length){const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();return;}if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();return;}}}
 if(e.key==='Escape'){if(state.detailMoreOpen){state.detailMoreOpen=false;render();document.querySelector('.detail-more-btn')?.focus();return;}if(state.modal){closeModal();return;}if(state.mobileNavOpen){state.mobileNavOpen=false;render();$('.mobile-menu-btn')?.focus();return;}if(state.menu){const id=state.menu;state.menu=null;render();[...document.querySelectorAll('.more-actions-btn[data-id="'+id+'"]')].find(x=>x.getClientRects().length)?.focus();return;}closeOptions();return;}
 if(!['categoryQuery','payeeQuery'].includes(e.target.id))return;const cat=e.target.id==='categoryQuery';const list=$(cat?'#categoryOptions':'#payeeOptions');if(!list)return;const opts=[...list.querySelectorAll('.option')];if(!opts.length)return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(list.hidden)showOptions(cat?'category':'payee');let i=Number(list.dataset.active||-1);i=e.key==='ArrowDown'?Math.min(opts.length-1,i+1):Math.max(0,i-1);list.dataset.active=String(i);opts.forEach((o,j)=>o.classList.toggle('active',j===i));}
 else if(e.key==='Enter'&&!list.hidden){e.preventDefault();const active=Number(list.dataset.active);handleAction(opts[Math.max(0,active)]);}
});
window.addEventListener('resize',updateStickyHistoryOffset);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&state.page==='form'&&hasDraftContent(state.current))flushDraft();});
window.addEventListener('pagehide',()=>{if(state.page==='form'&&hasDraftContent(state.current))flushDraft();});
// 簡化的原型內可測試 API。正式系統不可使用前端函式取代伺服器驗證。
window.UXPrototypeTest={get state(){return state;},formatAmount:amt,normalizeDate:normalizedDate,validNum,net,uniquePayees};
render();
