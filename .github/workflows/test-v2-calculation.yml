name: Test v2 calculation regression

on:
  push:
    branches: [main]
    paths:
      - 'v2-preview/app.js'
      - 'v2-preview/calculation-engine.js'
      - 'v2-preview/treaty-engine.js'
      - 'v2-preview/tests/**'
      - '.github/workflows/test-v2-calculation.yml'
  pull_request:
    paths:
      - 'v2-preview/app.js'
      - 'v2-preview/calculation-engine.js'
      - 'v2-preview/treaty-engine.js'
      - 'v2-preview/tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v2 regression tests
        run: node --test v2-preview/tests/*.test.mjs
